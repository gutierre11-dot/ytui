[package]
name = "ytui"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "TUI em português para baixar músicas e vídeos do YouTube, YouTube Music e Spotify"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.1"

[profile.release]
lto = "thin"
strip = true
